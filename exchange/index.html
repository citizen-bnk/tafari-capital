<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tafari Minerals Exchange</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console — fixed left rail of the seven deal stages, working area on the right, side drawer for every form. */
:root{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface-2:#EBEAE4; --ink:#17191C; --muted:#5C605D; --line:#D9D7CF;
  --gold:#86672C; --gold-ink:#FFFFFF; --gold-soft:#EFE6D2;
  --ok:#2D7A4C; --ok-soft:#DFF0E5; --warn:#9E6210; --warn-soft:#F6EAD3; --bad:#AE372D; --bad-soft:#F6DFDB; --info:#2C5C8A; --info-soft:#DEE9F4;
  --shadow:0 1px 2px rgba(23,25,28,.06),0 8px 24px rgba(23,25,28,.06);
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101113; --surface:#191A1D; --surface-2:#222327; --ink:#ECEAE3; --muted:#A3A29B; --line:#2E2F33;
  --gold:#CFAB66; --gold-ink:#16130C; --gold-soft:#372E1F;
  --ok:#6DC08F; --ok-soft:#1B3226; --warn:#E1A851; --warn-soft:#382B17; --bad:#EF7E72; --bad-soft:#3B1F1C; --info:#82B2E1; --info-soft:#1B2938;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101113; --surface:#191A1D; --surface-2:#222327; --ink:#ECEAE3; --muted:#A3A29B; --line:#2E2F33;
  --gold:#CFAB66; --gold-ink:#16130C; --gold-soft:#372E1F;
  --ok:#6DC08F; --ok-soft:#1B3226; --warn:#E1A851; --warn-soft:#382B17; --bad:#EF7E72; --bad-soft:#3B1F1C; --info:#82B2E1; --info-soft:#1B2938;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px;font-family:var(--f-body);font-weight:600}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand img{width:38px;height:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1;display:block}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:16px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--gold-soft);color:var(--ink)}
.nav a[aria-current="page"] .k{color:var(--gold)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}

main{padding-block:28px 64px;padding-inline:32px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-weight:500;text-align:left}

.banner{border:1px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:8px;margin-bottom:18px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .v{font-size:26px;font-family:var(--f-display);line-height:1.1}
.tile .l{font-size:12px;color:var(--muted)}

.section{margin-top:28px}
.section > h2{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel.pad{padding:18px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:8px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col h4{margin:0;font-size:12px;font-weight:600;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--gold)}
.card b{font-weight:600}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty-col{font-size:12px;color:var(--muted);padding:6px 2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.flag-ZA,.flag-LS{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li > div{min-width:0}

/* asset detail */
.crumb{margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px 14px;margin:0}
.dl dt{color:var(--muted);font-size:12.5px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

.stagebar{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px}
.stagebar span{flex:1 1 90px;font-size:11px;padding:6px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);text-align:center}
.stagebar span.done{background:var(--gold-soft);color:var(--gold)}
.stagebar span.now{background:var(--gold);color:var(--gold-ink);font-weight:600}

.score{display:flex;align-items:center;gap:16px}
.gauge{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c,var(--gold)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.gauge i{width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:22px}

.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.doc select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.doc .note{grid-column:1/-1}
.doc .note input{width:100%;background:transparent;border:1px dashed var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;color:var(--muted)}
.crit{color:var(--bad);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}

.gate{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.gate:last-child{border-bottom:0}
.gate input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px}
.captable{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:10px 0}
.captable span{display:block;height:100%}

.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{width:14px;height:6px;border-radius:3px;background:var(--surface-2)}
.steps span.on{background:var(--gold)}

.flowmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.flowmap .st{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.flowmap .st .n{font-family:var(--f-mono);color:var(--gold);font-size:12px}
.flowmap .st ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}
pre.code{background:var(--surface-2);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:12px;margin:10px 0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);gap:12px}
.drawer form{display:flex;flex-direction:column;min-height:0;flex:1}
.drawer .body{padding:18px 20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;align-content:start;flex:1}
.drawer .foot{display:flex;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field .help{font-size:11.5px;color:var(--muted)}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav-label,.rail-foot{display:none}
  .nav a{white-space:nowrap}
  main{padding-inline:16px;padding-block:20px 56px}
  .drawer .body{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="app">
  <aside class="rail">
    <div class="brand"><img alt="Tafari Capital lion" src="../assets/lion.png"><div><b>Tafari Minerals Exchange</b><span>Tafari Capital</span></div></div>
    <nav class="nav" id="nav">
      <div class="nav-label">Operate</div>
      <a href="#overview" data-view="overview"><span class="k">◆</span>Overview</a>
      <a href="#assets" data-view="assets"><span class="k">1</span>Listings &amp; verification</a>

      <a href="#tokens" data-view="tokens"><span class="k">3</span>Tokenization</a>

</div>

<script>
/* ---------- reference data ---------- */
const COUNTRIES={ZA:"South Africa",LS:"Lesotho"};
const COMMODITIES=["Chrome","Coal","Diamonds","Dimension stone","Manganese","Iron ore","PGMs","Gold","Aggregates","Other"];
const STAGES=[
 {k:"listed",l:"Listed"},{k:"verifying",l:"Verification"},{k:"verified",l:"Verified"},{k:"dealroom",l:"Deal room"},
 {k:"offer",l:"Under offer"},{k:"transacting",l:"Transaction & tokens"},{k:"operating",l:"Operating"},{k:"offtake",l:"Offtake & export"}];
const stageLabel=k=>(STAGES.find(s=>s.k===k)||{l:k}).l;
const stageIdx=k=>Math.max(0,STAGES.findIndex(s=>s.k===k));

const DOCS={
 ZA:[
  {k:"cipc",l:"Company registration and share register",src:"CIPC BizPortal",w:2},
  {k:"right",l:"Mining right, mining permit or prospecting right",src:"DMPR regional office",w:3,crit:1},
  {k:"samrad",l:"SAMRAD record matching the right",src:"SAMRAD Online",w:2},
  {k:"mandate",l:"Owner's mandate or board resolution to sell",src:"Signed by the holder's directors",w:2,crit:1},
  {k:"mwp",l:"Mining Work Programme and Social and Labour Plan",src:"DMPR",w:1},
  {k:"ea",l:"Environmental authorisation and financial provision",src:"DMPR / DFFE",w:2},
  {k:"wul",l:"Water use licence",src:"DWS e-WULAAS",w:1},
  {k:"tcs",l:"Tax compliance status PIN",src:"SARS eFiling",w:1},
  {k:"bee",l:"B-BBEE certificate and Mining Charter status",src:"SANAS-accredited verifier",w:1},
  {k:"cpr",l:"Competent Person's Report (SAMREC)",src:"Registered Competent Person",w:3},
  {k:"assays",l:"Independent laboratory assays",src:"SGS / Bureau Veritas",w:2},
  {k:"surface",l:"Surface rights or land access agreement",src:"Deeds Office / landowner",w:1}],
 LS:[
  {k:"inc",l:"Certificate of incorporation and share register",src:"Registrar of Companies (OBFC)",w:2},
  {k:"licence",l:"Mining lease, mining licence or prospecting licence",src:"Department of Mines",w:3,crit:1},
  {k:"board",l:"Mining Board recommendation and Ministerial approval",src:"Ministry of Natural Resources",w:2},
  {k:"mandate",l:"Owner's mandate or board resolution to sell",src:"Signed by the holder's directors",w:2,crit:1},
  {k:"env",l:"Environmental clearance",src:"Department of Environment",w:2},
  {k:"lra",l:"Tax clearance certificate",src:"Lesotho Revenue Authority",w:1},
  {k:"land",l:"Land rights and community consultation record",src:"Land Administration Authority / council",w:1},
  {k:"state",l:"Government equity position under the lease",src:"Mining lease terms",w:1},
  {k:"cpr",l:"Independent resource report (SAMREC / JORC)",src:"Registered Competent Person",w:3},
  {k:"assays",l:"Independent laboratory assays or valuation",src:"SGS / Bureau Veritas / Government valuator",w:2}]
};
const DOC_STATUS=[["missing","Not received"],["received","Received"],["verified","Verified at source"],["rejected","Rejected"],["na","Not applicable"]];
const docTone={missing:"",received:"info",verified:"ok",rejected:"bad",na:""};

const GATES=[
 {k:"spv",l:"SPV incorporated and asset or shares held in it"},
 {k:"consent",l:"Ministerial consent obtained (MPRDA s11 / Lesotho Mines and Minerals Act)"},
 {k:"licence",l:"Licensed issuer or authorised partner appointed (FSCA / Central Bank of Lesotho)"},
 {k:"valuation",l:"Independent valuation signed off"},
 {k:"kyc",l:"Every token buyer cleared for KYC / FICA"},
 {k:"ownership",l:"Ownership check passed (Mining Charter / state equity)"},
 {k:"exco",l:"Exchange control approval where funds cross the CMA"},
 {k:"legal",l:"Legal opinion on the token structure received"}];

const PARTNER_CATS=["Yellow plant & equipment","Contract mining","Washing & processing","Road haulage","Rail","Port & terminal","Clearing & customs","Shipping line","Verification & labs","Legal","Tokenization & custody","Funding"];
const PARTNER_STATUS=["Not contacted","In contact","NDA signed","Agreement signed","Active"];
const ROLES=["Equipment supply","Contract miner","Processing / washing","Road transport","Rail","Port","Clearing agent","Shipping","Verification","Legal","Tokenization","Funding"];
const BUYER_KYC=["Not started","In progress","Cleared","Failed"];
const POF=["Not provided","Requested","Received","Verified"];
const OFFER_STATUS=["Interest","NCNDA pending","NDA signed","Due diligence","Offer made","Accepted","Declined"];
const SHIP_STEPS=["Contracted","Loaded at mine","At processing plant","In transit","At border / port","Customs cleared","Shipped","Delivered"];
const PORTS=["Durban","Richards Bay","Maputo","Gqeberha (Port Elizabeth)","Saldanha Bay","Inland delivery"];

/* ---------- state ---------- */
const S={assets:[],buyers:[],offers:[],partners:[],shipments:[],ready:false,dbState:"loading",canWrite:null,files:null,
  view:"overview",assetId:null,assetTab:"summary",filter:{country:"",commodity:"",stage:"",q:""}};
let db=null;

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=(arr,id)=>arr.find(x=>x.id===id);
const fmtMoney=(n,c)=>n||n===0?`${c||"ZAR"} ${Number(n).toLocaleString("en-ZA",{maximumFractionDigits:0})}`:"—";
const today=()=>new Date().toISOString().slice(0,10);

function score(a){
  const list=DOCS[a.country]||DOCS.ZA;let tw=0,got=0;
  for(const d of list){const s=a.docs?.[d.k]?.status||"missing";if(s==="na")continue;tw+=d.w;got+=d.w*(s==="verified"?1:s==="received"?.4:0);}
  let sc=tw?got/tw*100:0;
  for(const f of (a.flags||[]).filter(f=>f.open)) sc-=f.severity==="critical"?15:5;
  return Math.max(0,Math.round(sc));
}
function rating(sc){return sc>=80?["Low risk","ok"]:sc>=60?["Moderate risk","warn"]:["High risk","bad"];}
function eligibility(a){
  const why=[];const sc=score(a);
  if(sc<70) why.push(`Verification score is ${sc}. It must reach 70.`);
  const crit=(a.flags||[]).filter(f=>f.open&&f.severity==="critical");
  if(crit.length) why.push(`${crit.length} critical red flag${crit.length>1?"s are":" is"} still open.`);
  for(const d of (DOCS[a.country]||DOCS.ZA).filter(d=>d.crit)){ if((a.docs?.[d.k]?.status)!=="verified") why.push(`"${d.l}" is not verified at source.`); }
  return why;
}
function logEntry(a,text){return [{t:new Date().toISOString(),text},...(a.log||[])].slice(0,40);}


/* ---------- local storage adapter (used when the page runs outside claude.ai) ----------
   Mirrors the small Firestore-style surface the app uses, so a hosted backend
   (e.g. Firebase / Firestore) can be dropped in later without touching the UI code. */
function makeLocalDB(){
  const KEY="tafari-exchange-v1";let store={};const subs={};
  try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){store={};}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};
  const rid=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-4);
  const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
  const merge=(a,b)=>{const o={...(a||{})};for(const[k,v]of Object.entries(b)){o[k]=isObj(v)&&isObj(o[k])?merge(o[k],v):v;}return o;};
  const clone=v=>JSON.parse(JSON.stringify(v));
  const snap=c=>({docs:Object.entries(store[c]||{}).sort(([a],[b])=>a<b?-1:1).map(([id,d])=>({id,exists:true,data:()=>clone(d)}))});
  const notify=c=>(subs[c]||[]).forEach(fn=>fn(snap(c)));
  const ref=(c,id)=>({id,path:c+"/"+id,
    async set(d){(store[c]=store[c]||{})[id]=clone(d);persist();notify(c);},
    async update(d){if(!store[c]||!store[c][id])throw{code:"invalid_argument",message:"Record not found"};store[c][id]=merge(store[c][id],clone(d));persist();notify(c);},
    async delete(){if(store[c]){delete store[c][id];persist();notify(c);}},
    async get(){const d=store[c]&&store[c][id];return{id,exists:!!d,data:()=>d&&clone(d)};}});
  const coll=c=>({path:c,doc:id=>ref(c,id||rid()),async add(d){const r=ref(c,rid());await r.set(d);return r;},
    onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);setTimeout(()=>fn(snap(c)),0);return()=>{subs[c]=subs[c].filter(f=>f!==fn);};}});
  return{collection:coll,doc:p=>{const i=p.lastIndexOf("/");return ref(p.slice(0,i),p.slice(i+1));}};
}

const COLS=["assets","buyers","offers","partners","shipments"];
async function boot(){
  render();
  const hosted=!!(window.claude&&window.claude.use);
  if(hosted){ try{ db=await window.claude.use("db"); }catch(e){ db=null; } }
  if(!hosted){ db=makeLocalDB(); S.dbState="local"; }
  else if(!db){S.dbState="off";S.ready=true;render();return;}
  if(hosted) try{const u=await window.claude.use("user"); if(u){const c=await u.can?.("data.write"); S.canWrite=c;} }catch(e){}
  if(hosted) try{ S.files=await window.claude.use("assets"); }catch(e){ S.files=null; }
  let pending=COLS.length;
  for(const c of COLS){
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(pending>0){pending--; if(pending===0){S.ready=true;if(S.dbState!=="local")S.dbState="on";}}
      render();
    },err=>{toast("Live updates stopped. Reload the page to reconnect.");});
  }
}
async function save(fn,msg){
  if(!db){toast("Sign in to claude.ai to save changes.");return false;}
  try{await fn(); if(msg) toast(msg); return true;}
  catch(e){
    if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("Your access is view-only, so this change was not saved.");}
    else if(e&&e.code==="quota_exceeded") toast("The register is full. Remove old records, then try again.");
    else toast("Could not save: "+(e?.message||e?.code||"unknown error"));
    return false;
  }
}
const docRef=(c,id)=>db.doc(`${c}/${id}`);
async function updateAsset(a,patch,logText,msg){
  const p={...patch,updatedAt:new Date().toISOString()};
  if(logText) p.log=logEntry(a,logText);
  return save(()=>docRef("assets",a.id).update(p),msg);
}

function vAsset(){
  const a=byId(S.assets,S.assetId);
  if(!a) return `<div class="crumb"><button class="linkbtn" data-act="go" data-view="assets">← All listings</button></div>`+(S.ready?`<div class="panel empty"><b>This listing is not available</b>It may have been deleted.</div>`:loading());
  const sc=score(a);const[rl,rt]=rating(sc);const si=stageIdx(a.stage);
  const tabs=[["summary","Summary"],["docs","Documents"],["flags","Red flags"],["deal","Buyers & offers"],["tokens","Tokenization"],["ops","Operations team"],["log","Activity"]];
  const body={summary:tSummary,docs:tDocs,flags:tFlags,deal:tDeal,tokens:tTokens,ops:tOps,log:tLog}[S.assetTab]||tSummary;
  return `<div class="crumb"><button class="linkbtn" data-act="go" data-view="assets">← All listings</button></div>
  <div class="head"><div><div class="eyebrow">${esc(a.code||"Listing")} · ${esc(COUNTRIES[a.country]||"")}</div><h1>${esc(a.name)}</h1><p>${esc([a.commodity,a.location].filter(Boolean).join(" · "))}</p></div>
   <div class="actions"><button class="btn" data-act="editAsset">Edit details</button>${stageButtons(a)}</div></div>
  <div class="stagebar">${STAGES.map((s,i)=>`<span class="${i<si?"done":i===si?"now":""}">${s.l}</span>`).join("")}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${S.assetTab===k}" data-act="tab" data-tab="${k}">${l}${k==="flags"&&(a.flags||[]).some(f=>f.open)?` <span class="pill bad">${(a.flags||[]).filter(f=>f.open).length}</span>`:""}</button>`).join("")}</div>
  ${body(a,sc,rl,rt)}`;
}
function stageButtons(a){
  const i=stageIdx(a.stage);
  if(a.stage==="listed") return `<button class="btn primary" data-act="stage" data-to="verifying">Start verification</button>`;
  if(a.stage==="verifying"){const why=eligibility(a);return `<button class="btn primary" data-act="stage" data-to="verified" ${why.length?"disabled":""} title="${esc(why.join(" "))}">Mark verified</button>`;}
  if(a.stage==="verified") return `<button class="btn primary" data-act="stage" data-to="dealroom">Release to deal room</button>`;
  if(a.stage==="transacting"&&a.spv?.issued) return `<button class="btn primary" data-act="stage" data-to="operating">Start operations</button>`;
  if(a.stage==="operating") return `<button class="btn primary" data-act="stage" data-to="offtake">Move to offtake</button>`;
  return "";
}
function tSummary(a,sc,rl,rt){
  const why=eligibility(a);
  const dl=[["Right holder",a.holder],["Registration no.",a.regNo],["Right",[a.rightType,a.rightStatus].filter(Boolean).join(" — ")],["Reference",a.rightRef&&`<span class="mono">${esc(a.rightRef)}</span>`],["Area",a.hectares?a.hectares+" ha":""],["Claimed resource",a.resourceMt?`${a.resourceMt} Mt (${a.resourceStd||"standard not stated"})`:""],["Grade",a.grade],["Operating status",a.opStatus],["Owner offers",a.dealType],["Asking price",a.askPrice?fmtMoney(a.askPrice,a.currency):""],["Owner contact",a.contact],["Introduced by",a.introducer]];
  return `<div class="grid2"><div class="panel pad"><h3 style="margin-bottom:12px">Owner's claims</h3><dl class="dl">${dl.map(([k,v])=>`<dt>${k}</dt><dd>${v?(String(v).startsWith("<span")?v:esc(v)):'<span class="muted">—</span>'}</dd>`).join("")}</dl>${a.notes?`<p class="muted" style="margin:14px 0 0;white-space:pre-wrap">${esc(a.notes)}</p>`:""}</div>
  <div class="panel pad"><h3 style="margin-bottom:12px">Verification</h3><div class="score"><div class="gauge" style="--p:${sc};--c:var(--${rt})"><i class="num">${sc}</i></div><div>${pill(rl,rt)}<p class="muted" style="margin:8px 0 0;font-size:12.5px">Documents verified at source count in full, received documents count 40%, open red flags deduct points.</p></div></div>
  <h3 style="margin:18px 0 8px">Deal room readiness</h3>${why.length?`<ul style="margin:0;padding-left:18px">${why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:`<p style="margin:0">${pill("Ready","ok")} All critical checks pass.</p>`}</div></div>`;
}
function tDocs(a){
  const list=DOCS[a.country]||DOCS.ZA;
  const n=list.filter(d=>(a.docs?.[d.k]?.status)==="verified").length;
  return `<p class="muted" style="margin-top:0">${n} of ${list.length} verified at source. Checklist for ${esc(COUNTRIES[a.country])}; confirm requirements with counsel in that country.${S.files?"":" File uploads are available to editors of this page."}</p>
  <div class="panel">${list.map(d=>{const x=a.docs?.[d.k]||{};const st=x.status||"missing";
   return `<div class="doc"><div><b>${esc(d.l)}</b>${d.crit?`<span class="crit">Critical</span>`:""}<div class="muted" style="font-size:12.5px">Check at: ${esc(d.src)}${x.checkedOn?` · checked ${esc(x.checkedOn)}`:""}${x.fileId?` · <a href="/_blob/${esc(x.fileId)}" target="_blank" rel="noopener">${esc(x.fileName||"View file")}</a>`:""}</div></div>
   <div class="ctl">${pill(DOC_STATUS.find(s=>s[0]===st)[1],docTone[st])}<select id="ds_${d.k}" aria-label="Status of ${esc(d.l)}" data-change="docStatus" data-k="${d.k}">${DOC_STATUS.map(([k,l])=>`<option value="${k}" ${st===k?"selected":""}>${l}</option>`).join("")}</select>${S.files?`<label class="btn small" style="cursor:pointer">Upload<input type="file" hidden data-change="docFile" data-k="${d.k}" accept=".pdf,.png,.jpg,.jpeg,.webp,.csv,.txt"></label>`:""}</div>
   <div class="note"><input id="dn_${d.k}" aria-label="Note for ${esc(d.l)}" placeholder="Add a verification note (who checked, what the source showed)" value="${esc(x.note||"")}" data-change="docNote" data-k="${d.k}"></div></div>`}).join("")}</div>`;
}
function tFlags(a){
  const flags=a.flags||[];
  return `<div class="head" style="margin-bottom:12px"><p style="margin:0" class="muted">Inconsistencies found during verification. A critical flag blocks release to buyers until it is resolved.</p><button class="btn primary" data-act="addFlag">Add red flag</button></div>
  <div class="panel list">${flags.length?flags.map((f,i)=>`<div class="li"><div><div style="display:flex;gap:8px;flex-wrap:wrap">${pill(f.severity==="critical"?"Critical":"Minor",f.severity==="critical"?"bad":"warn")}${f.open?"":pill("Resolved","ok")}</div><div style="margin-top:6px;${f.open?"":"text-decoration:line-through;color:var(--muted)"}">${esc(f.text)}</div>${f.resolution?`<div class="muted" style="font-size:12.5px;margin-top:4px">Resolution: ${esc(f.resolution)}</div>`:""}</div><div class="actions">${f.open?`<button class="btn small" data-act="resolveFlag" data-i="${i}">Resolve</button>`:`<button class="btn small" data-act="reopenFlag" data-i="${i}">Reopen</button>`}</div></div>`).join(""):`<div class="empty"><b>No red flags recorded</b>Record anything that does not match: a right claimed as granted with no grant letter, mismatched names, missing consents.</div>`}</div>`;
}
function tDeal(a){
  const offers=S.offers.filter(o=>o.assetId===a.id);
  const locked=stageIdx(a.stage)<stageIdx("dealroom");
  return `<div class="head" style="margin-bottom:12px"><p style="margin:0" class="muted">${locked?"This asset is not yet in the deal room. Early interest can be logged, but release the full data pack only after verification and a signed NCNDA.":"Buyers who have seen this asset and where each stands."}</p><button class="btn primary" data-act="newOffer" data-id="${a.id}">Record interest or offer</button></div>`+offerTable(offers,false);
}
function offerTable(offers,showAsset=true){
  if(!offers.length) return `<div class="panel empty"><b>No buyer interest recorded</b>Log each buyer's interest, NDA and offer here so the whole team sees the same position.</div>`;
  return `<div class="panel tablewrap"><table><thead><tr>${showAsset?"<th>Asset</th>":""}<th>Buyer</th><th>Structure</th><th>Offer</th><th>Status</th><th></th></tr></thead><tbody>${offers.map(o=>{const a=byId(S.assets,o.assetId),b=byId(S.buyers,o.buyerId);const tone=o.status==="Accepted"?"ok":o.status==="Declined"?"bad":o.status==="NCNDA pending"?"warn":"info";
   return `<tr>${showAsset?`<td>${a?`<button class="linkbtn" data-act="openAsset" data-id="${a.id}">${esc(a.name)}</button>`:"—"}</td>`:""}<td>${esc(b?b.name:"—")}<div class="muted" style="font-size:12.5px">KYC: ${esc(b?.kyc||"Not started")} · Funds: ${esc(b?.pof||"Not provided")}</div></td><td>${esc(o.kind||"—")}${o.stakePct?` <span class="num">(${esc(o.stakePct)}%)</span>`:""}</td><td class="num">${o.amount?fmtMoney(o.amount,o.currency):"—"}</td><td>${pill(o.status||"Interest",tone)}</td><td><button class="btn small" data-act="editOffer" data-id="${o.id}">Edit</button></td></tr>`}).join("")}</tbody></table></div>`;
}
function tTokens(a){
  const spv=a.spv||{};const gates=spv.gates||{};const done=GATES.filter(g=>gates[g.k]).length;const allDone=done===GATES.length;
  const total=Number(spv.totalTokens||0);const alloc=spv.allocations||[];const used=alloc.reduce((s,x)=>s+Number(x.tokens||0),0);
  const colors=["var(--gold)","var(--info)","var(--ok)","var(--warn)","var(--bad)"];
  const eligible=stageIdx(a.stage)>=stageIdx("offer");
  return `${eligible?"":`<div class="banner">Tokenization opens once a buyer offer is in progress. Set up the SPV now if useful; tokens cannot be issued until every gate below is ticked.</div>`}
  <div class="grid2">
   <div class="panel pad"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px"><h3>Special purpose vehicle</h3><button class="btn small" data-act="editSpv">Edit</button></div>
    <dl class="dl"><dt>SPV name</dt><dd>${esc(spv.name||"—")}</dd><dt>Registration no.</dt><dd>${esc(spv.regNo||"—")}</dd><dt>What a token represents</dt><dd>${esc(spv.represents||"One share in the SPV")}</dd><dt>Total tokens</dt><dd class="num">${total?total.toLocaleString("en-ZA"):"—"}</dd><dt>Price per token</dt><dd class="num">${spv.pricePerToken?fmtMoney(spv.pricePerToken,spv.currency):"—"}</dd><dt>Implied value</dt><dd class="num">${total&&spv.pricePerToken?fmtMoney(total*spv.pricePerToken,spv.currency):"—"}</dd><dt>Issuer / platform</dt><dd>${esc(spv.issuer||"—")}</dd><dt>Status</dt><dd>${spv.issued?pill("Tokens issued","ok"):pill("Not issued")}</dd></dl></div>
   <div class="panel"><div style="padding:16px 16px 6px;display:flex;justify-content:space-between"><h3>Compliance gates</h3><span class="muted num">${done}/${GATES.length}</span></div>${GATES.map(g=>`<label class="gate"><input type="checkbox" id="g_${g.k}" data-change="gate" data-k="${g.k}" ${gates[g.k]?"checked":""} ${spv.issued?"disabled":""}><span>${esc(g.l)}</span></label>`).join("")}</div>
  </div>
  <div class="panel pad section"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3>Token allocation</h3><div class="actions"><button class="btn small" data-act="addAlloc" ${total?"":"disabled"}>Allocate to buyer</button><button class="btn small primary" data-act="issue" ${allDone&&total&&used>0&&!spv.issued&&eligible?"":"disabled"}>Issue tokens</button></div></div>
   ${total?`<div class="captable">${alloc.map((x,i)=>`<span style="width:${(x.tokens/total*100).toFixed(2)}%;background:${colors[i%colors.length]}" title="${esc((byId(S.buyers,x.buyerId)||{}).name||"Buyer")}"></span>`).join("")}</div><p class="muted num" style="margin:0 0 10px">${used.toLocaleString("en-ZA")} of ${total.toLocaleString("en-ZA")} tokens allocated (${(used/total*100).toFixed(1)}%). ${used>=total?"Full buyout.":"Unallocated tokens stay with the current owner."}</p>`:`<p class="muted">Set the total number of tokens in the SPV first.</p>`}
   ${alloc.length?`<div class="list">${alloc.map((x,i)=>{const b=byId(S.buyers,x.buyerId);return `<div class="li"><div style="display:flex;gap:10px;align-items:center"><span style="width:10px;height:10px;border-radius:2px;background:${colors[i%colors.length]}"></span><div><b>${esc(b?b.name:"Unknown buyer")}</b> <span class="muted">· KYC ${esc(b?.kyc||"Not started")}</span></div></div><div class="actions"><span class="num">${Number(x.tokens).toLocaleString("en-ZA")} (${(x.tokens/total*100).toFixed(1)}%)</span>${spv.issued?"":`<button class="btn small" data-act="rmAlloc" data-i="${i}">Remove</button>`}</div></div>`}).join("")}</div>`:""}
  </div>`;
}
function tOps(a){
  const team=a.team||[];
  return `<div class="head" style="margin-bottom:12px"><p style="margin:0" class="muted">The service providers proposed or contracted to work this asset: equipment, contract mining, processing, transport and legal.</p><button class="btn primary" data-act="addTeam">Assign a partner</button></div>
  <div class="panel list">${team.length?team.map((t,i)=>{const p=byId(S.partners,t.partnerId);return `<div class="li"><div><b>${esc(p?p.name:"Removed partner")}</b><div class="muted" style="font-size:12.5px">${esc(t.role)}${p?" · "+esc(p.category):""}${t.note?" · "+esc(t.note):""}</div></div><div class="actions">${pill(t.status,t.status==="Contracted"?"ok":t.status==="Quoted"?"info":"")}<button class="btn small" data-act="rmTeam" data-i="${i}">Remove</button></div></div>`}).join(""):`<div class="empty"><b>No partners assigned</b>Assign equipment suppliers, contract miners and logistics providers from the partner directory.</div>`}</div>`;
}
function tLog(a){return `<div class="panel list">${(a.log||[]).map(l=>`<div class="li"><div>${esc(l.text)}</div><div class="muted mono" style="white-space:nowrap">${esc((l.t||"").slice(0,16).replace("T"," "))}</div></div>`).join("")||`<div class="empty">No activity yet.</div>`}</div>`;}

function vDeal(){
  return head("Stage 4","Buyers & deal room","Vetted buyers, their KYC and proof of funds, and every interest or offer across the portfolio.",`<button class="btn" data-act="newBuyer">Register a buyer</button><button class="btn primary" data-act="newOffer">Record interest or offer</button>`)+
  (!S.ready?loading():`<div class="section" style="margin-top:0"><h2>Offers and interest</h2>${offerTable(S.offers)}</div>
  <div class="section"><h2>Buyer register</h2>${S.buyers.length?`<div class="panel tablewrap"><table><thead><tr><th>Buyer</th><th>Type</th><th>Interested in</th><th>KYC / FICA</th><th>Proof of funds</th><th>Deals</th></tr></thead><tbody>${S.buyers.map(b=>{const n=S.offers.filter(o=>o.buyerId===b.id).length;return `<tr class="click" data-act="editBuyer" data-id="${b.id}"><td><b>${esc(b.name)}</b><div class="muted" style="font-size:12.5px">${esc(b.country||"")}${b.introducer?" · via "+esc(b.introducer):""}</div></td><td>${esc(b.type||"—")}</td><td>${esc(b.interest||"—")}</td><td>${pill(b.kyc||"Not started",b.kyc==="Cleared"?"ok":b.kyc==="Failed"?"bad":b.kyc==="In progress"?"info":"warn")}</td><td>${pill(b.pof||"Not provided",b.pof==="Verified"?"ok":b.pof==="Received"?"info":"warn")}</td><td class="num">${n}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="panel empty"><b>No buyers registered</b>Register each buyer once, with KYC and proof-of-funds status, before showing them verified assets.</div>`}</div>`);
}
function vTokens(){
  const A=S.assets.filter(a=>a.spv&&(a.spv.name||a.spv.totalTokens||Object.keys(a.spv.gates||{}).length));
  return head("Stage 5","Tokenization","Each transacted asset sits in an SPV. Tokens represent shares or economic interest in that SPV, never the mining right itself, and are issued only when every compliance gate is met.")+
  `<div class="banner" style="border-color:var(--info);background:var(--info-soft)">Tokens are likely to be regulated financial products in South Africa (FSCA) and need a licensed issuer or partner. A change of control in a right holder needs Ministerial consent. Confirm the structure with counsel before any issue.</div>`+
  (!S.ready?loading():A.length?`<div class="panel tablewrap"><table><thead><tr><th>Asset</th><th>SPV</th><th>Gates met</th><th>Tokens</th><th>Allocated</th><th>Status</th></tr></thead><tbody>${A.map(a=>{const s=a.spv;const g=GATES.filter(x=>s.gates?.[x.k]).length;const used=(s.allocations||[]).reduce((t,x)=>t+Number(x.tokens||0),0);return `<tr class="click" data-act="openAsset" data-id="${a.id}" data-tab="tokens"><td><b>${esc(a.name)}</b></td><td>${esc(s.name||"—")}</td><td class="num">${g}/${GATES.length}</td><td class="num">${s.totalTokens?Number(s.totalTokens).toLocaleString("en-ZA"):"—"}</td><td class="num">${s.totalTokens?(used/s.totalTokens*100).toFixed(1)+"%":"—"}</td><td>${s.issued?pill("Issued","ok"):pill("In preparation","warn")}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="panel empty"><b>No SPVs set up yet</b>Open an asset that has a buyer offer and use its Tokenization tab to set up the SPV.</div>`);
}
function vPartners(){
  const cats=PARTNER_CATS.map(c=>[c,S.partners.filter(p=>p.category===c)]).filter(([,l])=>l.length);
  return head("Stage 6","Partners & operations","Equipment suppliers, contract miners, processors, logistics and advisers Tafari can bring to a deal. Assign them to an asset from its Operations team tab.",`<button class="btn primary" data-act="newPartner">Add a partner</button>`)+
  (!S.ready?loading():cats.length?cats.map(([c,l])=>`<div class="section" style="margin-top:18px"><h2>${esc(c)}</h2><div class="panel list">${l.map(p=>{const used=S.assets.filter(a=>(a.team||[]).some(t=>t.partnerId===p.id)).length;return `<div class="li"><div><button class="linkbtn" data-act="editPartner" data-id="${p.id}"><b>${esc(p.name)}</b></button><div class="muted" style="font-size:12.5px">${esc([p.country,p.contact,p.terms].filter(Boolean).join(" · "))||"No contact recorded"}</div></div><div class="actions">${used?pill(used+" asset"+(used>1?"s":""),"gold"):""}${pill(p.status||"Not contacted",p.status==="Active"||p.status==="Agreement signed"?"ok":p.status==="Not contacted"||!p.status?"":"info")}</div></div>`}).join("")}</div></div>`).join(""):`<div class="panel empty"><b>No partners on file</b>Add equipment suppliers, contract miners, wash plants, hauliers, rail, port and clearing partners.</div>`);

function vLogistics(){
  return head("Stage 7","Offtake & logistics","From mine gate to vessel: processing, road and rail, border and port, customs and shipping for each offtake contract.",`<button class="btn primary" data-act="newShipment">New offtake / shipment</button>`)+
  (!S.ready?loading():S.shipments.length?`<div class="panel tablewrap"><table><thead><tr><th>Contract</th><th>Asset</th><th>Volume</th><th>Route</th><th>Progress</th><th></th></tr></thead><tbody>${S.shipments.map(s=>{const a=byId(S.assets,s.assetId);const st=Number(s.step||0);const nm=id=>(byId(S.partners,id)||{}).name;
   return `<tr><td><b class="mono">${esc(s.ref)}</b><div class="muted" style="font-size:12.5px">${esc(s.offtaker||"")} · ${esc(s.incoterm||"")}</div></td><td>${a?`<button class="linkbtn" data-act="openAsset" data-id="${a.id}">${esc(a.name)}</button>`:"—"}<div class="muted" style="font-size:12.5px">${esc(s.product||"")}</div></td><td class="num">${s.tonnes?Number(s.tonnes).toLocaleString("en-ZA")+" t":"—"}<div class="muted" style="font-size:12.5px">${s.price?fmtMoney(s.price,s.currency)+"/t":""}</div></td><td style="font-size:12.5px">${esc([a?.name?"Mine":"",nm(s.processor),nm(s.haulier),nm(s.rail),s.port,nm(s.shipping),s.destination].filter(Boolean).join(" → "))}</td><td><div class="steps">${SHIP_STEPS.map((x,i)=>`<span class="${i<=st?"on":""}" title="${esc(x)}"></span>`).join("")}</div><div style="font-size:12.5px;margin-top:4px">${esc(SHIP_STEPS[st])}</div></td><td><div class="actions">${st<SHIP_STEPS.length-1?`<button class="btn small" data-act="shipNext" data-id="${s.id}">Next step</button>`:""}<button class="btn small" data-act="editShipment" data-id="${s.id}">Edit</button></div></td></tr>`}).join("")}</tbody></table></div>`:`<div class="panel empty"><b>No offtake contracts yet</b>When an operating asset sells product, open a shipment here to track it from mine to port and through customs.</div>`)+
  `<div class="section"><h2>Export document pack</h2><div class="panel list">${[["Export permit / SARS exporter registration","SARS Customs"],["Certificate of analysis and weight","SGS / Bureau Veritas"],["Commercial invoice and packing list","Seller"],["Customs export declaration (SAD 500)","Clearing agent"],["LRA customs clearance for Lesotho product crossing into SA","Lesotho Revenue Authority"],["Bill of lading","Shipping line"],["Certificate of origin (SADC / other)","Chamber of commerce / SARS"]].map(([d,w])=>`<div class="li"><div>${esc(d)}</div><div class="muted">${esc(w)}</div></div>`).join("")}</div></div>`;

function vIntegrations(){
  const rows=[
   ["Tafari Capital website","Entry point","Link or button on the main site that opens this platform","Link"],
   ["CIPC BizPortal","Verification","Company and director details for South African holders","Manual check"],
   ["SAMRAD Online / DMPR","Verification","Status of mining and prospecting rights","Manual check"],

   ["5","Transaction","SPV, consent, tokens",["DMPR / Lesotho Minister","Licensed token partner"]],
   ["6","Operations","Equipment and contract mining",["OEMs and dealers","Contract miners"]],
   ["7","Offtake","Processing, transport, export",["Wash plants, hauliers","Transnet, ports, customs"]]].map(([n,t,d,l])=>`<div class="st"><div class="n">${n}</div><b>${t}</b><div class="muted" style="font-size:12.5px">${d}</div><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div>
  <div class="section"><h2>Connections</h2><div class="panel tablewrap"><table><thead><tr><th>System</th><th>Stage</th><th>Used for</th><th>Today</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${pill(r[3],tone(r[3]))}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="section"><h2>Add it to the Tafari Capital website</h2><div class="panel pad"><p style="margin-top:0">Paste this button into the main website where clients should enter the platform. The Exchange lives at tafaricapital.co.ls/exchange/. Use this button on partner sites or in email signatures.</p>
  <pre class="code" id="snippet">&lt;a href="PLATFORM_LINK" target="_blank" rel="noopener"
   style="display:inline-block;padding:12px 22px;background:#86672C;color:#fff;
   border-radius:6px;font-family:sans-serif;text-decoration:none"&gt;
   List or buy a verified mining asset
&lt;/a&gt;</pre><button class="btn small" data-act="copySnippet">Copy code</button>
  <p class="muted" style="margin-bottom:0;font-size:12.5px">This prototype is Tafari's internal operating console. Owners and buyers outside Tafari will need the production version of the platform, with its own sign-up, before they can submit documents themselves.</p></div></div>`;
}

/* ---------- interactions ---------- */
function go(view){S.view=view;if(view!=="asset")S.assetId=null;try{history.replaceState(null,"","#"+(view==="asset"?"assets":view));}catch(e){}render();window.scrollTo(0,0);}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.view)go(h);});
document.addEventListener("click",async e=>{
  const navA=e.target.closest("#nav a");if(navA){e.preventDefault();go(navA.dataset.view);return;}
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act;const a=byId(S.assets,S.assetId);
  switch(act){
   case "close":closeForm();break;
   case "del1":el.textContent="Confirm delete";el.dataset.act="del2";break;
   case "del2":{const f=formCtx;closeForm();await f.onDelete();render();break;}
   case "go":go(el.dataset.view);break;
   case "newAsset":newAsset();break;
   case "openAsset":S.assetId=el.dataset.id;S.assetTab=el.dataset.tab||"summary";S.view="asset";render();window.scrollTo(0,0);break;
   case "tab":S.assetTab=el.dataset.tab;render();break;
   case "editAsset":editAsset(a);break;
   case "stage":{const to=el.dataset.to;if(to==="verified"&&eligibility(a).length){toast("Resolve the readiness items first.");break;}await updateAsset(a,{stage:to},`Stage moved to ${stageLabel(to)}`,`Moved to ${stageLabel(to)}`);break;}
   case "addFlag":openForm({title:"Add red flag",fields:[{k:"text",l:"What does not match?",type:"textarea",req:1,full:1},{k:"severity",l:"Severity",type:"select",opts:[["critical","Critical — blocks buyers"],["minor","Minor — note for buyers"]]}],
     onSubmit:v=>updateAsset(a,{flags:[...(a.flags||[]),{text:v.text,severity:v.severity,open:true,raised:today()}]},`Red flag raised: ${v.text}`,"Red flag added")});break;
   case "resolveFlag":{const i=+el.dataset.i;openForm({title:"Resolve red flag",intro:a.flags[i].text,fields:[{k:"resolution",l:"How was it resolved?",type:"textarea",req:1,full:1}],
     onSubmit:v=>{const fl=a.flags.map((f,j)=>j===i?{...f,open:false,resolution:v.resolution,resolvedOn:today()}:f);return updateAsset(a,{flags:fl},`Red flag resolved: ${a.flags[i].text}`,"Resolved");}});break;}
   case "reopenFlag":{const i=+el.dataset.i;const fl=a.flags.map((f,j)=>j===i?{...f,open:true}:f);await updateAsset(a,{flags:fl},`Red flag reopened`,"Reopened");break;}
   case "newOffer":offerForm(null,el.dataset.id||(a&&a.id));break;
   case "editOffer":offerForm(byId(S.offers,el.dataset.id));break;
   case "newBuyer":buyerForm();break;
   case "editBuyer":buyerForm(byId(S.buyers,el.dataset.id));break;
   case "newPartner":partnerForm();break;
   case "editPartner":partnerForm(byId(S.partners,el.dataset.id));break;
   case "newShipment":shipmentForm();break;
   case "editShipment":shipmentForm(byId(S.shipments,el.dataset.id));break;
   case "shipNext":{const s=byId(S.shipments,el.dataset.id);const n=Math.min(SHIP_STEPS.length-1,Number(s.step||0)+1);await save(()=>docRef("shipments",s.id).update({step:n}),SHIP_STEPS[n]);break;}
   case "editSpv":{const s=a.spv||{};openForm({title:"Special purpose vehicle",fields:[{k:"name",l:"SPV name",full:1},{k:"regNo",l:"Registration no."},{k:"issuer",l:"Issuer / token platform"},{k:"represents",l:"What one token represents",full:1,def:"One ordinary share in the SPV"},{k:"totalTokens",l:"Total tokens",type:"number",min:0},{k:"pricePerToken",l:"Price per token",type:"number",min:0,step:"any"},{k:"currency",l:"Currency",type:"select",opts:["ZAR","USD","LSL"],def:"ZAR"}],values:s,
     onSubmit:v=>updateAsset(a,{spv:v},"SPV details updated","Saved")});break;}
   case "addAlloc":{const s=a.spv||{};const used=(s.allocations||[]).reduce((t,x)=>t+Number(x.tokens||0),0);const left=Number(s.totalTokens||0)-used;
     if(!S.buyers.length){toast("Register the buyer first.");break;}
     openForm({title:"Allocate tokens",intro:`${left.toLocaleString("en-ZA")} tokens unallocated. Allocating all of them is a full buyout.`,fields:[{k:"buyerId",l:"Buyer",type:"select",req:1,opts:S.buyers.map(b=>[b.id,b.name]),blank:"Choose"},{k:"tokens",l:"Tokens",type:"number",min:1,req:1,def:left}],
     onSubmit:v=>{if(v.tokens>left||v.tokens<=0){toast(`Enter between 1 and ${left} tokens.`);return false;}const b=byId(S.buyers,v.buyerId);return updateAsset(a,{spv:{allocations:[...(s.allocations||[]),{buyerId:v.buyerId,tokens:v.tokens}]}},`${v.tokens} tokens allocated to ${b?.name}`,"Allocated");}});break;}
   case "rmAlloc":{const i=+el.dataset.i;const al=(a.spv.allocations||[]).filter((_,j)=>j!==i);await updateAsset(a,{spv:{allocations:al}},"Token allocation removed","Removed");break;}
   case "issue":{const unclear=(a.spv.allocations||[]).filter(x=>(byId(S.buyers,x.buyerId)||{}).kyc!=="Cleared");if(unclear.length){toast("Every token buyer must be KYC-cleared before issue.");break;}
     await updateAsset(a,{stage:"transacting",spv:{issued:true,issuedOn:today()}},"Tokens issued","Tokens issued");break;}
   case "addTeam":{if(!S.partners.length){toast("Add partners to the directory first.");break;}
     openForm({title:"Assign a partner",fields:[{k:"partnerId",l:"Partner",type:"select",req:1,opts:S.partners.map(p=>[p.id,`${p.name} (${p.category})`]),blank:"Choose"},{k:"role",l:"Role on this asset",type:"select",opts:ROLES},{k:"status",l:"Status",type:"select",opts:["Proposed","Quoted","Contracted"]},{k:"note",l:"Note",full:1}],
     onSubmit:v=>{const p=byId(S.partners,v.partnerId);return updateAsset(a,{team:[...(a.team||[]),v]},`${p?.name} assigned as ${v.role}`,"Partner assigned");}});break;}
   case "rmTeam":{const i=+el.dataset.i;await updateAsset(a,{team:(a.team||[]).filter((_,j)=>j!==i)},"Partner removed from asset","Removed");break;}
   case "copySnippet":{const t=document.getElementById("snippet").textContent;try{await navigator.clipboard.writeText(t);toast("Code copied");}catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("snippet"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Press Ctrl+C to copy");}break;}
  }
});
let filterT;
document.addEventListener("input",e=>{const f=e.target.dataset.filter;if(f==="q"){clearTimeout(filterT);S.filter.q=e.target.value;filterT=setTimeout(render,180);}});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.filter&&t.dataset.filter!=="q"){S.filter[t.dataset.filter]=t.value;render();return;}
  const ch=t.dataset.change;if(!ch)return;const a=byId(S.assets,S.assetId);if(!a)return;const k=t.dataset.k;
  const label=((DOCS[a.country]||DOCS.ZA).find(d=>d.k===k)||{}).l||k;
  if(ch==="docStatus") await updateAsset(a,{docs:{[k]:{status:t.value,checkedOn:today()}}},`${label}: ${DOC_STATUS.find(s=>s[0]===t.value)[1]}`);
  else if(ch==="docNote") await updateAsset(a,{docs:{[k]:{note:t.value}}},null,"Note saved");
  else if(ch==="gate") await updateAsset(a,{spv:{gates:{[k]:t.checked}}},`Gate ${t.checked?"met":"reopened"}: ${(GATES.find(g=>g.k===k)||{}).l}`);
  else if(ch==="docFile"){const file=t.files&&t.files[0];if(!file||!S.files)return;
    const ext=(file.name.split(".").pop()||"").toLowerCase();const types={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",csv:"text/csv",txt:"text/plain"};
    toast("Uploading…");
    try{const r=await S.files.upload(file,{type:types[ext]||file.type});const cur=a.docs?.[k]?.status;
      await updateAsset(a,{docs:{[k]:{fileId:r.id,fileName:file.name,status:(!cur||cur==="missing")?"received":cur}}},`${label}: file uploaded (${file.name})`,"File uploaded");}
    catch(err){toast(err?.code==="too_large"?"That file is over 20 MB.":err?.code==="unsupported_type"?"Upload a PDF, image, CSV or text file.":"Upload failed: "+(err?.message||err?.code));}}
});

(function init(){const h=location.hash.slice(1);if(h&&["overview","assets","dealroom","tokens","partners","logistics","integrations"].includes(h))S.view=h;boot();})();
</script>
